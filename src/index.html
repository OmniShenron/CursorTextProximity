<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CURIOUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #030308;
      cursor: none;
    }

    #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    /* ── Custom cursor ─────────────────────────────────── */
    #cur-dot {
      position: fixed; top: 0; left: 0;
      width: 5px; height: 5px; border-radius: 50%;
      background: #fff;
      pointer-events: none; z-index: 9999;
      transform: translate(-999px,-999px);
      will-change: transform;
      mix-blend-mode: difference;
    }
    #cur-ring {
      position: fixed; top: 0; left: 0;
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.30);
      pointer-events: none; z-index: 9998;
      transform: translate(-999px,-999px);
      will-change: transform;
      transition:
        width .40s cubic-bezier(.16,1,.3,1),
        height .40s cubic-bezier(.16,1,.3,1),
        border-color .5s ease, opacity .5s ease;
    }
    #cur-ring.near  { width:52px; height:52px; border-color:rgba(180,190,255,.65); }
    #cur-ring.click { width:18px; height:18px; border-color:rgba(255,255,255,.9);
                      transition:width .10s ease,height .10s ease; }

    /* ── Word identity accent bar (bottom) ─────────────── */
    #accent-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 2px;
      pointer-events: none; z-index: 30;
      background: var(--word-color, #7b8cff);
      opacity: 0.55;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.9s cubic-bezier(.16,1,.3,1), background 0.8s ease;
    }
    #accent-bar.show { transform: scaleX(1); }

    /* ── Morph scrub bar ────────────────────────────────── */
    #scrub-bar {
      position: fixed; bottom: 2px; left: 0;
      height: 2px;
      background: rgba(255,255,255,0.22);
      pointer-events: none; z-index: 31;
      width: 0%;
      transition: width .08s linear, opacity .5s ease;
    }

    /* ── Top-left: word number ──────────────────────────── */
    #word-num {
      position: fixed; top: 30px; left: 38px;
      font-family: 'Space Grotesk', monospace;
      font-size: 10px; font-weight: 300;
      letter-spacing: .42em; color: rgba(255,255,255,.14);
      pointer-events: none; z-index: 20;
    }

    /* ── Top-right: word name ───────────────────────────── */
    #word-name {
      position: fixed; top: 30px; right: 38px;
      font-family: 'Space Grotesk', monospace;
      font-size: 10px; font-weight: 300;
      letter-spacing: .42em; text-transform: uppercase;
      color: rgba(255,255,255,.14);
      pointer-events: none; z-index: 20;
      transition: opacity .5s ease;
    }

    /* ── Hint bottom-centre ─────────────────────────────── */
    #hint {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', monospace;
      font-size: 9px; font-weight: 300;
      letter-spacing: .48em; text-transform: uppercase;
      color: rgba(255,255,255,.11);
      pointer-events: none; z-index: 20;
      white-space: nowrap;
      transition: opacity 1.6s ease;
    }
    #hint.gone { opacity: 0; }

    /* ── Shockwave ring (CSS, fires on morph complete) ───── */
    #shock {
      position: fixed; top: 50%; left: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0);
      transform: translate(-50%,-50%) scale(1);
      pointer-events: none; z-index: 25;
      opacity: 0;
    }
    #shock.fire {
      animation: shockwave .75s cubic-bezier(0,.5,.5,1) forwards;
    }
    @keyframes shockwave {
      0%  { transform:translate(-50%,-50%) scale(.5); border-color:rgba(255,255,255,.6); opacity:1; }
      100%{ transform:translate(-50%,-50%) scale(7);  border-color:rgba(255,255,255,0);  opacity:0; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>
  <div id="word-num">01 / 05</div>
  <div id="word-name">CURIOUS</div>
  <div id="hint">HOVER &nbsp;·&nbsp; SCROLL TO DRAG &nbsp;·&nbsp; CLICK TO MORPH</div>
  <div id="accent-bar"></div>
  <div id="scrub-bar"></div>
  <div id="shock"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
