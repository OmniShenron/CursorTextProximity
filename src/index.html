<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>QUANTUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #04040a;
      cursor: none;
    }

    #c {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
    }

    /* ── Custom cursor ─────────────────────────────────── */
    #cur-dot {
      position: fixed; top: 0; left: 0;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-999px,-999px);
      will-change: transform;
      transition: background 0.3s ease, transform 0.05s linear;
    }

    #cur-ring {
      position: fixed; top: 0; left: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-999px,-999px);
      will-change: transform;
      transition:
        width  0.35s cubic-bezier(0.16,1,0.3,1),
        height 0.35s cubic-bezier(0.16,1,0.3,1),
        border-color 0.4s ease,
        opacity 0.4s ease;
    }

    #cur-ring.near {
      width: 58px; height: 58px;
      border-color: rgba(110,120,255,0.70);
    }

    #cur-ring.clicking {
      width: 22px; height: 22px;
      border-color: rgba(180,200,255,0.90);
      transition: width 0.12s ease, height 0.12s ease;
    }

    /* ── Word label (top-right) ─────────────────────────── */
    #word-label {
      position: fixed; top: 28px; right: 38px;
      font-family: 'Space Grotesk', monospace;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    /* ── Word counter (top-left) ────────────────────────── */
    #word-counter {
      position: fixed; top: 28px; left: 38px;
      font-family: 'Space Grotesk', monospace;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.38em;
      color: rgba(255,255,255,0.12);
      pointer-events: none;
      z-index: 20;
    }

    /* ── Hint ───────────────────────────────────────────── */
    #hint {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', monospace;
      font-size: 9px; font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.12);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      transition: opacity 1.6s ease;
    }
    #hint.gone { opacity: 0; }

    /* ── Morph progress bar ─────────────────────────────── */
    #progress {
      position: fixed; bottom: 0; left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(110,120,255,0.5), transparent);
      pointer-events: none;
      z-index: 20;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Custom cursor -->
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <!-- UI chrome -->
  <div id="word-counter">01 / 05</div>
  <div id="word-label">QUANTUM</div>
  <div id="hint">HOVER &nbsp;·&nbsp; SCROLL &nbsp;·&nbsp; CLICK TO MORPH</div>
  <div id="progress"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
